# Robolectric exécute les tests JVM hôte contre ce niveau d'API Android. Figé
# à 34 (le plus haut niveau dont Robolectric 4.14 embarque un runtime) bien
# que l'app compile contre le SDK 36 — le SDK runtime n'affecte que le
# framework émulé.
sdk=34

# Application neutre à la place d'ElanApp : la vraie application monte le
# graphe Hilt et lance les tâches de démarrage (import de l'ancienne base sur
# la vraie `elan.db`) en arrière-plan — un travail concurrent qui ouvrirait la
# base pendant chaque test et entrerait en collision avec les fixtures. Aucun
# test JVM ne dépend d'ElanApp : les dépôts sont construits à la main
# (TestSupport), les écrans Compose tournent dans une ComponentActivity nue.
application=android.app.Application
