name: Build native APK

# Build natif (Kotlin / Compose) d'Élan 2.0. Tourne sur la branche `native` et
# les pull requests ; remplacera ci.yml et android-apk.yml à la fusion dans main.
on:
  push:
    branches: [native]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

# Run JavaScript-based actions on Node.js 24 (the current LTS runtime) rather
# than the deprecated Node 20. Node 24 becomes the runner default in mid-2026;
# setting it explicitly puts CI on LTS now and clears the deprecation warning.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/libs.versions.toml') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # Unit + Robolectric/Compose tests run on the JVM (no emulator), so they
      # gate every build. Fail fast here before spending time on the APKs.
      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: elan-unit-test-report
          path: app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore

      # Debug APK first — it is fully installable on its own and is the
      # guaranteed deliverable even if the minified release build hiccups.
      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: elan-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Build release APK (R8 minified)
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: elan-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      # Android App Bundle — the artifact uploaded to the Play Store. Signed
      # with the upload key when the signing secrets are present; otherwise it
      # falls back to the debug key and is suitable for inspection only, not
      # for Play submission. Configure repo secrets KEYSTORE_BASE64 (the .jks
      # base64-encoded), KEYSTORE_PASSWORD, KEY_ALIAS and KEY_PASSWORD.
      - name: Build release AAB (App Bundle)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "${{ github.workspace }}/elan-upload.jks"
            export KEYSTORE_FILE="${{ github.workspace }}/elan-upload.jks"
          else
            echo "No KEYSTORE_BASE64 secret set — AAB will be debug-signed (not store-ready)."
          fi
          ./gradlew bundleRelease --stacktrace

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: elan-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      # Fail the build if any bundled native library is not 16 KB page-aligned,
      # which Google Play requires for new apps/updates on Android 15+. Runs
      # after upload so the .aab is still downloadable for diagnosis on failure.
      - name: Verify 16 KB native-lib alignment
        run: |
          chmod +x scripts/check-16kb-alignment.sh
          ./scripts/check-16kb-alignment.sh app/build/outputs/bundle/release/app-release.aab

      # Zéro API bord à bord obsolète dans le dex final (avertissement Play
      # « deprecated edge-to-edge APIs » qui a motivé le portage natif).
      - name: Verify no deprecated edge-to-edge API
        run: |
          chmod +x scripts/check-deprecated-edge-to-edge.sh
          ./scripts/check-deprecated-edge-to-edge.sh app/build/outputs/apk/release/app-release.apk

      # Taille de téléchargement arm64 < 15 Mo (objectif du portage natif).
      - name: Verify download size per ABI
        run: |
          chmod +x scripts/check-bundle-size.sh
          ./scripts/check-bundle-size.sh app/build/outputs/bundle/release/app-release.aab 15

      # Stage the downloadable assets under stable filenames (so the README's
      # permalinks keep resolving) plus a checksum file, which is what lets
      # someone verify a sideloaded APK against what CI actually built.
      - name: Stage download assets (main only)
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/elan-debug.apk
          cp app/build/outputs/apk/release/app-release.apk dist/elan-release.apk
          (cd dist && sha256sum elan-debug.apk elan-release.apk > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt

      # Rolling "latest" release: a one-tap, login-free download of the current
      # main build. Marked as a pre-release / not-latest so it never displaces
      # the semantic-release version tag that /releases/latest resolves to.
      - name: Publish rolling release (main only)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Élan — latest build
          prerelease: true
          make_latest: false
          files: |
            dist/elan-debug.apk
            dist/elan-release.apk
            dist/SHA256SUMS.txt
          body: |
            Build automatique de `main` (commit ${{ github.sha }}).
            Aucun compte GitHub nécessaire — touchez un lien ci-dessous depuis votre téléphone.

            | Téléchargement | Usage |
            |---|---|
            | [**elan-release.apk**](https://github.com/${{ github.repository }}/releases/download/latest/elan-release.apk) | Usage quotidien (minifié) |
            | [elan-debug.apk](https://github.com/${{ github.repository }}/releases/download/latest/elan-debug.apk) | Débogage / rapports de bug |

            Autorisez ensuite l'installation depuis des *sources inconnues* quand Android le demande, puis ouvrez le fichier.

            Les deux APK sont signés avec la clé debug pour le sideloading. Vérifiez un téléchargement avec
            [`SHA256SUMS.txt`](https://github.com/${{ github.repository }}/releases/download/latest/SHA256SUMS.txt)
            via `sha256sum -c SHA256SUMS.txt`.

            Vous cherchez une version stable ? Voir la
            [dernière release](https://github.com/${{ github.repository }}/releases/latest).
